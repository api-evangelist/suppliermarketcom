description: 'SupplierMarket.com was a business-to-business procurement marketplace surfaced as a portfolio
  company of Battery Ventures and added to the API Evangelist network as a stub for enrichment. As of the
  2026-07-21 enrichment pass the suppliermarket.com domain no longer resolves to a live website (HTTPS
  connection times out on both apex and www), carries no MX records, and its DNS is authoritative on SAP
  nameservers (ns1.sap.net, ns2.sap.de, ns3.sap.com, ns4.sap.asia) — indicating the property is now held
  by SAP. No developer portal, api./developer./docs. subdomains, OpenAPI, or any other public API surface
  could be found. There is nothing to enrich: this is a defunct/absorbed company with no active API.'
